name: Deploy Admin UI

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy UI via SSH
        uses: appleboy/ssh-action@v1
        env:
          REACT_APP_GOOGLE_MAPS_KEY: ${{ secrets.REACT_APP_GOOGLE_MAPS_KEY }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: REACT_APP_GOOGLE_MAPS_KEY
          script: |
            cd /var/www/mrbike-admin-ui

            echo "Pulling latest UI code..."
            git fetch origin
            git reset --hard origin/main

            echo "Installing dependencies..."
            npm ci || npm install

            echo "Building React app..."
            if [ -z "$REACT_APP_GOOGLE_MAPS_KEY" ]; then
              echo "Missing required GitHub Actions secret: REACT_APP_GOOGLE_MAPS_KEY"
              exit 1
            fi
            REACT_APP_GOOGLE_MAPS_KEY="$REACT_APP_GOOGLE_MAPS_KEY" npm run build

            echo "Updating nginx build folder..."
            rm -rf /var/www/admin/build
            cp -r build /var/www/admin/

            systemctl reload nginx
